<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MazOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


   <div id="login-screen">

    <h1>Os sus</h1>

    <div class="user">
        <img src="strona/use.jpg" alt="User profile image" width="100" height="100">
    </div>

    <h2>BAKA</h2>

    <button id="login-button">
        Log in
    </button>

</div>



    <div id="desktop">

        <div class="desktop-icon files-icon" onclick="openApp('files-window')" role="button" tabindex="0">
            <img src="strona/images.webp" alt="Susy baka" width="50" height="50">
            <span>Files</span>
        </div>
        <div class="desktop-icon sus-icon" onclick="openApp('Sus-window')" role="button" tabindex="0">
            <img src="strona/vent.png" alt="User profile image" width="58" height="58">
            <span>Sus ?? </span>
        </div>

        <div class="desktop-icon notes-icon" onclick="openApp('notes-window')" role="button" tabindex="0">
            <img src="strona/use.jpg" alt="Susy baka" width="50" height="50">
            <span>Notes</span>
        </div>

        <div class="desktop-icon calculator-icon" onclick="openApp('calculator-window')" role="button" tabindex="0">
            <img src="strona/susy.webp" alt="Calculator" width="50" height="50">
            <span>Calculator</span>
        </div>

        <div class="desktop-icon settings-icon" onclick="openApp('settings-window')" role="button" tabindex="0">
            <img src="strona/images.jpg" alt="Susy baka" width="50" height="50">
            <span>Settings</span>
        </div>

        <div id="start-menu" class="start-menu" hidden>
            <button class="start-menu-item" data-app="files-window"><img src="strona/images.webp" alt="Susy baka" width="20" height="20"> Files</button>
            <button class="start-menu-item" data-app="notes-window"><img src="strona/use.jpg" alt="Susy baka" width="20" height="20">  Notes</button>
            <button class="start-menu-item" data-app="calculator-window"><img src="strona/susy.webp" alt="Calculator" width="20" height="20"> Calculator</button>
            <button class="start-menu-item" data-app="settings-window"><img src="strona/images.jpg" alt="Susy baka" width="20" height="20">  Settings</button>
            <button class="start-menu-item logout-item" data-action="logout"><img src="strona/pasta.jpg" alt="Susy baka" width="20" height="20"> Log out</button>
        </div>

        <div id="files-window" class="app-window" hidden>
            <div class="window-header" data-drag-handle>
                <span>Files</span>
                <button class="close-window" onclick="closeApp('files-window')">×</button>
            </div>
            <div class="image-gallery">
                <img src="strona/vent.png" alt="User profile image">
                <img src="strona/images.webp" alt="Web page screenshot">
                <img src="strona/images.jpg" alt="Another image">
            </div>
        </div>

        <div id="notes-window" class="app-window" hidden>
            <div class="window-header" data-drag-handle>
                <span>Notes</span>
                <button class="close-window" onclick="closeApp('notes-window')">×</button>
            </div>
            <textarea placeholder="Write a note..."></textarea>
        </div>


        <div id="Sus-window" class="app-window" hidden>
            <div class="window-header" data-drag-handle>
                <span>Sus ??</span>
                <button class="close-window" onclick="closeApp('Sus-window')">×</button>
            </div>
            <p>You have been susy baka, prepare for anihilation.</p>
        </div>

        <div id="calculator-window" class="app-window calculator-app" hidden>
            <div class="window-header" data-drag-handle>
                <span>Calculator</span>
                <button class="close-window" onclick="closeApp('calculator-window')">×</button>
            </div>
            <div class="calculator-body">
                <div class="calculator-display" id="calculator-output">0</div>
                <div class="calculator-grid">
                    <button class="calculator-btn calculator-clear" data-action="clear">C</button>
                    <button class="calculator-btn" data-action="delete">⌫</button>
                    <button class="calculator-btn" data-action="operator" data-value="/">÷</button>
                    <button class="calculator-btn" data-action="operator" data-value="*">×</button>

                    <button class="calculator-btn" data-action="number" data-value="7">7</button>
                    <button class="calculator-btn" data-action="number" data-value="8">8</button>
                    <button class="calculator-btn" data-action="number" data-value="9">9</button>
                    <button class="calculator-btn" data-action="operator" data-value="-">−</button>

                    <button class="calculator-btn" data-action="number" data-value="4">4</button>
                    <button class="calculator-btn" data-action="number" data-value="5">5</button>
                    <button class="calculator-btn" data-action="number" data-value="6">6</button>
                    <button class="calculator-btn" data-action="operator" data-value="+">+</button>

                    <button class="calculator-btn" data-action="number" data-value="1">1</button>
                    <button class="calculator-btn" data-action="number" data-value="2">2</button>
                    <button class="calculator-btn" data-action="number" data-value="3">3</button>
                    <button class="calculator-btn calculator-equals" data-action="equals">=</button>

                    <button class="calculator-btn calculator-zero" data-action="number" data-value="0">0</button>
                    <button class="calculator-btn" data-action="decimal">.</button>
                </div>
            </div>
        </div>

        <div id="settings-window" class="app-window" hidden>
            <div class="window-header" data-drag-handle>
                <span>Settings</span>
                <button class="close-window" onclick="closeApp('settings-window')">×</button>
            </div>
            <p>Settings will appear here.</p>
        </div>


        <div id="window-menu" class="window-menu" hidden>
            <button class="window-menu-item" data-action="logout">Log out</button>
        </div>

        <div id="popup-layer"></div>

        <div id="taskbar">

            <button id="start-button">
                🪟
            </button>

            <div id="clock">
                00:00
            </div>

        </div>

    </div>
    <div id="accessdenied-screen" hidden>
    </div>
    <div id="dead" class="dead-screen" hidden>

    </div>
    <div id="kicked" class="kicked-screen" hidden>
       
    </div>
        
       

    <script src="script.js"></script>

</body>

</html>
